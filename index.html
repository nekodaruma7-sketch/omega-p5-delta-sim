<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>絶オメガ P5 デルタ練習</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#101217;color:#eee;font-family:system-ui,-apple-system,sans-serif;height:100%;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:700px;margin:auto}
header{padding:10px 14px 6px;background:#171a21;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0}.sub{font-size:11px;color:#9ba3b4}
#hud{display:flex;gap:7px;align-items:center;padding:6px 10px;background:#171a21}
.badge{padding:4px 7px;border-radius:5px;background:#292e3a;font-size:11px}
#phase{flex:1;text-align:center;font-weight:700;font-size:13px}
button{border:0;border-radius:7px;background:#343b4a;color:#fff;padding:8px 11px;font-weight:700}
button:active{transform:scale(.97)}
#arenaWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#arena{position:relative;width:min(92vw,620px);aspect-ratio:1/1;border:2px solid #687080;border-radius:50%;background:
radial-gradient(circle,#222733 0 14%,transparent 14.5%),
linear-gradient(90deg,transparent 49.6%,#596172 49.7% 50.3%,transparent 50.4%),
linear-gradient(0deg,transparent 49.6%,#596172 49.7% 50.3%,transparent 50.4%),
#191d25;box-shadow:0 0 30px #000 inset;overflow:hidden;touch-action:none}
.grid{position:absolute;inset:8%;border:1px dashed #414856;border-radius:4px}
.player,.obj{position:absolute;transform:translate(-50%,-50%);z-index:5}
.player{width:28px;height:28px;border-radius:50%;background:#55d6ff;border:3px solid white;box-shadow:0 0 12px #55d6ff}
.obj{font-size:10px;text-align:center;font-weight:800}
.aoe{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#e64b5a55;border:2px solid #ef6673;z-index:2}
.line{position:absolute;height:3px;background:#f4d35e;transform-origin:0 50%;z-index:3}
.marker{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border:2px dashed #ffdc5e;border-radius:50%;z-index:4}
#toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:10px;background:#151821eF;text-align:center;font-weight:800;font-size:18px;z-index:20;display:none}
#info{padding:7px 12px;background:#171a21;text-align:center;font-size:12px;min-height:39px}
#controls{padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#11141a;display:flex;gap:6px;flex-wrap:wrap}
#controls button{flex:1;min-width:90px}
.good{color:#72e6a2}.bad{color:#ff7985}.hint{color:#f4d35e}
#log{font-size:11px;color:#aeb5c3;max-height:38px;overflow:hidden;padding:0 10px 4px}
</style>
</head>
<body>
<div id="app">
<header><div><h1>絶オメガ検証戦 P5 デルタ</h1><div class="sub">スマホ練習シミュレーター / 試作版</div></div><button onclick="resetRun()">リセット</button></header>
<div id="hud"><span class="badge" id="timer">0.0s</span><span id="phase">開始</span><span class="badge" id="score">成功 0 / 0</span></div>
<div id="arenaWrap"><div id="arena"><div class="grid"></div><div id="toast"></div><div id="player" class="player"></div></div></div>
<div id="info"><span id="instruction">「開始」を押してデルタを練習</span></div>
<div id="log"></div>
<div id="controls"><button onclick="startRun()">開始</button><button onclick="togglePause()">一時停止</button><button onclick="showHint()">ヒント</button></div>
</div>
<script>
const arena=document.querySelector('#arena'), p=document.querySelector('#player');
const phaseEl=document.querySelector('#phase'), timerEl=document.querySelector('#timer'), scoreEl=document.querySelector('#score');
const info=document.querySelector('#instruction'), toast=document.querySelector('#toast'), logEl=document.querySelector('#log');
let x=.5,y=.5,running=false,paused=false,start=0,timer=0,raf=null,step=0,score=0,tries=0,markers=[],aoes=[],lines=[];
const steps=[
 {t:0, name:"開幕", text:"中央付近で開始。次のギミックに備える。", dur:2.5},
 {t:2.5,name:"ロケットパンチ",text:"パンチ対象から離れ、指定方向へ移動。",dur:4},
 {t:6.5,name:"検知",text:"検知マーカーを処理。重ならないように位置調整。",dur:4},
 {t:10.5,name:"パイルピッチ",text:"自分の対象位置を確認し、担当地点へ。",dur:4},
 {t:14.5,name:"ハローワールド",text:"デバフを確認して所定位置へ。",dur:7},
 {t:21.5,name:"判定",text:"デルタ完走判定。",dur:2}
];
function pos(){
 p.style.left=(x*100)+'%';p.style.top=(y*100)+'%';
}
function clearFX(){markers.forEach(e=>e.remove());aoes.forEach(e=>e.remove());lines.forEach(e=>e.remove());markers=[];aoes=[];lines=[]}
function mkMarker(px,py,label=""){let e=document.createElement('div');e.className='marker';e.style.left=px*100+'%';e.style.top=py*100+'%';e.textContent=label;arena.append(e);markers.push(e)}
function mkAoe(px,py,r=.12){let e=document.createElement('div');e.className='aoe';e.style.left=px*100+'%';e.style.top=py*100+'%';e.style.width=e.style.height=(r*200)+'%';arena.append(e);aoes.push(e)}
function setPhase(i){
 step=i; clearFX(); phaseEl.textContent=steps[i].name; info.textContent=steps[i].text;
 if(i===1){mkAoe(.28,.5,.14);mkAoe(.72,.5,.14)}
 if(i===2){mkMarker(.25,.25,"検知");mkMarker(.75,.75,"検知")}
 if(i===3){mkMarker(.25,.75,"P");mkMarker(.75,.25,"P")}
 if(i===4){mkMarker(.22,.5,"HW");mkMarker(.78,.5,"HW");}
}
function log(s,good=false){logEl.innerHTML='<span class="'+(good?'good':'')+'">'+s+'</span>'}
function toastMsg(s,good){toast.textContent=s;toast.style.display='block';toast.className=good?'good':'bad';setTimeout(()=>toast.style.display='none',900)}
function evaluate(i){
 // prototype safety zones, intentionally forgiving
 let ok=true;
 if(i===1) ok=!((x>.15&&x<.42)&&(y>.36&&y<.64)) && !((x>.58&&x<.85)&&(y>.36&&y<.64));
 if(i===2) ok=!((x>.16&&x<.38&&y>.16&&y<.38)||(x>.62&&x<.84&&y>.62&&y<.84));
 if(i===3) ok=(x<.45||x>.55);
 if(i===4) ok=(x<.38||x>.62);
 tries++;
 if(ok){score++;toastMsg("処理成功！",true);log("GOOD：位置判定を通過",true)}else{toastMsg("処理失敗",false);log("NG：位置判定に失敗")}
 scoreEl.textContent=`成功 ${score} / ${tries}`;
}
function tick(now){
 if(!running)return;
 if(!paused){
  timer=(now-start)/1000;timerEl.textContent=timer.toFixed(1)+'s';
  let i=steps.findIndex((s,j)=>timer>=s.t && timer<s.t+s.dur);
  if(i<0 && timer>=steps[steps.length-1].t+steps[steps.length-1].dur){finish();return}
  if(i>=0 && i!==step)setPhase(i);
  if(i>=0 && i!==0 && Math.abs(timer-(steps[i].t))<.035 && !steps[i].checked){steps[i].checked=true;evaluate(i)}
 }
 raf=requestAnimationFrame(tick)
}
function startRun(){resetRun(false);running=true;paused=false;start=performance.now();steps.forEach(s=>delete s.checked);setPhase(0);raf=requestAnimationFrame(tick)}
function resetRun(full=true){running=false;paused=false;cancelAnimationFrame(raf);timer=0;timerEl.textContent='0.0s';x=.5;y=.5;pos();step=0;setPhase(0);if(full){info.textContent='「開始」を押してデルタを練習';log('待機中')}}
function finish(){running=false;phaseEl.textContent='完走';info.textContent='デルタ終了。もう一度「開始」で再挑戦。';log('RUN END：成功 '+score+' / '+tries,true);toastMsg('完走！',true)}
function togglePause(){if(!running)return;paused=!paused;if(!paused)start=performance.now()-timer*1000;info.textContent=paused?'一時停止中':'再開';}
function showHint(){if(!running){info.textContent='まず「開始」を押してね';return} const s=steps[step]; info.textContent='ヒント：'+s.text}
arena.addEventListener('pointerdown',e=>{if(!running||paused)return;move(e)})
arena.addEventListener('pointermove',e=>{if(!running||paused||e.buttons===0)return;move(e)})
function move(e){const r=arena.getBoundingClientRect();let nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;let dx=nx-.5,dy=ny-.5;let d=Math.hypot(dx,dy);if(d>.47){nx=.5+dx/d*.47;ny=.5+dy/d*.47}x=Math.max(.03,Math.min(.97,nx));y=Math.max(.03,Math.min(.97,ny));pos()}
pos();setPhase(0);
</script>
</body></html>
