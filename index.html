<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>絶オメガ P5 デルタ｜ハムカツ式</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1016;color:#f4f5f7;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow:hidden}
#app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column}
header{padding:9px 12px 6px;background:#171b24;border-bottom:1px solid #303744}h1{font-size:15px;margin:0 0 2px}.small{font-size:10px;color:#aab2c0}
#setup{padding:7px 10px;background:#12161e;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;background:#293140;color:#fff;border:1px solid #3c4657;border-radius:7px;padding:7px 9px}
#phasebar{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#171b24}#phase{font-weight:800;flex:1}.badge{font-size:11px;padding:4px 7px;background:#2b3240;border-radius:5px}
#arena{position:relative;width:min(94vw,650px);aspect-ratio:1/1;margin:auto;background:#1b2029;border:2px solid #697486;overflow:hidden;touch-action:none;background-image:linear-gradient(#252b36 1px,transparent 1px),linear-gradient(90deg,#252b36 1px,transparent 1px);background-size:10% 10%}
#arenaWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px}
.boss,.player,.member,.zone,.aoe,.line,.arm{position:absolute;transform:translate(-50%,-50%}
.boss{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;z-index:4;border:2px solid #ddd}.eye{background:#5d6879;width:30px;height:30px}.om{background:#8b5bd1}.fom{background:#5b88d9}
.player{width:27px;height:27px;border-radius:50%;background:#55d8ff;border:3px solid #fff;z-index:10;box-shadow:0 0 12px #55d8ff}.player:after{content:"自";font-size:10px;color:#071018;position:absolute;inset:0;display:grid;place-items:center;font-weight:900}
.member{width:20px;height:20px;border-radius:50%;border:1px solid #c5cedb;z-index:7;font-size:8px;display:grid;place-items:center;background:#667083}.near{background:#65bd75}.far{background:#d08c4a}
.line{height:3px;transform-origin:0 50%;z-index:3;border-radius:3px}.nearline{background:#5ee879}.farline{background:#e6a55b}.arm{height:5px;transform-origin:0 50%;background:#f1d05a;z-index:5}
.aoe{border-radius:50%;background:#d94b5750;border:2px solid #e56a73;z-index:2}.zone{border:2px dashed #fff;z-index:6;border-radius:4px;background:#ffffff0a;text-align:center;font-size:9px;padding-top:3px}.good{border-color:#70e8a0}.bad{border-color:#ff6876}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#11151def;border:1px solid #566173;border-radius:10px;padding:12px 18px;font-weight:900;font-size:18px;z-index:30;display:none;text-align:center}
#info{padding:7px 11px;background:#171b24;min-height:48px;font-size:12px;text-align:center}#controls{display:flex;gap:6px;padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:#0f1218}#controls button{flex:1}.primary{background:#3b63a8}
#timeline{display:flex;gap:3px;padding:5px 8px;background:#0c0f14}.t{height:5px;flex:1;background:#343b48;border-radius:4px}.t.on{background:#70a9ff}
</style>
</head>
<body>
<div id="app">
<header><h1>絶オメガ検証戦 P5 デルタ｜ハムカツ式</h1><div class="small">デルタ前半 → ハローワールド散開 練習プロトタイプ</div></header>
<div id="setup">
<label>自分 <select id="role"><option>MT</option><option>ST</option><option>H1</option><option>H2</option><option>D1</option><option>D2</option><option>D3</option><option>D4</option></select></label>
<label>線 <select id="debuff"><option value="near">ニア</option><option value="far">ファー</option></select></label>
<label>HW <select id="hw"><option value="none">なし</option><option value="near">ハロワニア</option><option value="far">ハロワファー</option></select></label>
<button onclick="randomize()">ランダム</button>
</div>
<div id="phasebar"><span id="phase">開始</span><span class="badge" id="clock">0.0s</span><span class="badge" id="result">0 / 0</span></div>
<div id="timeline"><i class="t"></i><i class="t"></i><i class="t"></i><i class="t"></i><i class="t"></i><i class="t"></i><i class="t"></i></div>
<div id="arenaWrap"><div id="arena">
<div class="boss eye" style="left:50%;top:5%">目</div><div class="boss om" style="left:13%;top:50%">虫Ω</div><div class="boss fom" style="left:87%;top:50%">FΩ</div>
<div class="player" id="player" style="left:50%;top:50%"></div><div id="toast"></div>
</div></div>
<div id="info">「開始」で実戦形式のデルタ練習。自キャラはフィールドをドラッグして移動。</div>
<div id="controls"><button class="primary" onclick="start()">開始</button><button onclick="pause()">一時停止</button><button onclick="hint()">今の判断</button><button onclick="resetRun()">リセット</button></div>
</div>
<script>
const arena=document.querySelector('#arena'),p=document.querySelector('#player'),roleEl=document.querySelector('#role'),debuffEl=document.querySelector('#debuff'),hwEl=document.querySelector('#hw');
const phaseEl=document.querySelector('#phase'),info=document.querySelector('#info'),clock=document.querySelector('#clock'),result=document.querySelector('#result'),toast=document.querySelector('#toast'),bars=[...document.querySelectorAll('.t')];
let x=.5,y=.5,running=false,paused=false,started=0,elapsed=0,phase=-1,score=0,tries=0,raf=0,checked=new Set(),rotation='L';
const phases=[[0,1.8,'初期散開','ニア／ファーを確認。虫Ω＝西、FΩ＝東。'],[1.8,5,'ロケットパンチ','パンチ色を確認。ハムカツ式は内側ペアが調整。'],[5,7.8,'アーム＆バッシュ','ニア＋外側ファー6人がアーム誘導。内側ファー2人はバッシュ側。'],[7.8,10.7,'検知＋パイルピッチ','検知対象と担当側の頭割り位置へ。'],[10.7,13.6,'旋回式波動砲','予兆を見て半面安置へ。線切りのタイミングに注意。'],[13.6,17.8,'ハローワールド','自分のハロワ種別を確認。ニア／ファーの距離を保つ。'],[17.8,19.2,'ハロワ発動','散開位置を維持して処理。']];
function clear(){document.querySelectorAll('.member,.line,.aoe,.arm,.zone').forEach(e=>e.remove())}
function make(cls,px,py,text=''){let e=document.createElement('div');e.className=cls;e.style.left=px*100+'%';e.style.top=py*100+'%';e.textContent=text;arena.append(e);return e}
function line(x1,y1,x2,y2,cls){let e=make('line '+cls,x1,y1);let dx=x2-x1,dy=y2-y1;e.style.width=Math.hypot(dx,dy)*100+'%';e.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;return e}
function zone(px,py,w,h,label){let e=make('zone',px,py,label);e.style.width=w*100+'%';e.style.height=h*100+'%';return e}
function members(){const roles=['MT','ST','H1','H2','D1','D2','D3','D4'],near=['MT','H1','D1','D4'],spots=[[.44,.18],[.56,.18],[.42,.30],[.58,.30],[.42,.70],[.58,.70],[.44,.82],[.56,.82]];roles.forEach((r,i)=>{if(r===roleEl.value)return;make('member '+(near.includes(r)?'near':'far'),spots[i][0],spots[i][1],r)})}
function render(i){clear();members();
if(i===0)info.textContent='ニア／ファーを確認。初期位置は目安。北＝目、左＝虫Ω、右＝FΩ。';
if(i===1){[.30,.70].forEach(xx=>{let a=make('aoe',xx,.5);a.style.width=a.style.height='18%'});line(.2,.25,.8,.25,'farline');line(.2,.75,.8,.75,'nearline');info.textContent='ロケパン：パンチ色を見て、内側ペアが調整。場所は早い者勝ち。'}
if(i===2){for(let yy of [.18,.82]){let a=make('arm',.25,yy);a.style.width='55%';a.style.transform=`rotate(${rotation==='L'?0:Math.PI}rad)`}zone(.38,.22,.16,.14,'アーム');zone(.38,.78,.16,.14,'アーム');info.textContent='アーム：ニア＋外側ファー6人が外周誘導。内側ファー2人はバッシュ側。'}
if(i===3){let a=make('aoe',.13,.5);a.style.width=a.style.height='22%';zone(.31,.5,.18,.18,'ニア頭割り');zone(.69,.5,.18,.18,'ファー頭割り');info.textContent='検知＋パイルピッチ。検知対象を確認し、担当側の頭割りへ。'}
if(i===4){zone(rotation==='L'?.32:.68,.5,.22,.75,'安置');info.textContent='旋回式波動砲：予兆を見て安置へ。ニア線は合流時の切断タイミングを意識。'}
if(i>=5){zone(.30,.34,.18,.12,'HWファー');zone(.52,.34,.18,.12,'HWニア');zone(.70,.66,.18,.12,'元ニア外');zone(.54,.66,.18,.12,'元ファー');line(.40,.34,.82,.34,'nearline');line(.40,.66,.82,.66,'farline');info.textContent=i===5?'ハロワ散開：ニア／ファーの距離を保つ。自分のHW種別に応じた持ち場へ。':'ハロワ発動。散開位置を維持し、デルタ完了。'}
}
function target(){let d=debuffEl.value,h=hwEl.value;if(phase<=0)return{x:.5,y:.3,w:.5,h:.4};if(phase===1)return d==='near'?{x:.60,y:.30,w:.22,h:.18}:{x:.40,y:.30,w:.22,h:.18};if(phase===2)return d==='near'?{x:.38,y:.22,w:.16,h:.14}:{x:.60,y:.22,w:.16,h:.14};if(phase===3)return d==='near'?{x:.31,y:.5,w:.18,h:.18}:{x:.69,y:.5,w:.18,h:.18};if(phase===4)return rotation==='L'?{x:.32,y:.5,w:.22,h:.75}:{x:.68,y:.5,w:.22,h:.75};if(h==='near')return{x:.52,y:.34,w:.18,h:.12};if(h==='far')return{x:.30,y:.34,w:.18,h:.12};return d==='near'?{x:.70,y:.66,w:.18,h:.12}:{x:.54,y:.66,w:.18,h:.12}}
function inside(t){return x>t.x-t.w/2&&x<t.x+t.w/2&&y>t.y-t.h/2&&y<t.y+t.h/2}
function evaluate(i){let ok=inside(target());tries++;if(ok)score++;result.textContent=`${score} / ${tries}`;toast.textContent=ok?'処理成功！':'位置ミス';toast.style.display='block';setTimeout(()=>toast.style.display='none',650)}
function setPhase(i){phase=i;phaseEl.textContent=phases[i][2];bars.forEach((b,n)=>b.classList.toggle('on',n<=i));render(i)}
function loop(now){if(!running)return;if(!paused){elapsed=(now-started)/1000;clock.textContent=elapsed.toFixed(1)+'s';let i=phases.findIndex(s=>elapsed>=s[0]&&elapsed<s[1]);if(i!==phase)setPhase(i);if(i>0&&!checked.has(i)){checked.add(i);evaluate(i)}if(elapsed>=phases[6][1]){finish();return}}raf=requestAnimationFrame(loop)}
function start(){resetRun(false);rotation=Math.random()<.5?'L':'R';running=true;started=performance.now();setPhase(0);raf=requestAnimationFrame(loop)}
function pause(){if(!running)return;paused=!paused;if(!paused)started=performance.now()-elapsed*1000}
function finish(){running=false;phaseEl.textContent='完走';info.textContent=`デルタ完走。成功 ${score}/${tries}。開始で再挑戦。`}
function resetRun(full=true){running=false;paused=false;cancelAnimationFrame(raf);elapsed=0;clock.textContent='0.0s';phase=-1;checked.clear();x=.5;y=.5;p.style.left='50%';p.style.top='50%';render(0);bars.forEach(b=>b.classList.remove('on'));phaseEl.textContent='開始';if(full)info.textContent='「開始」で実戦形式のデルタ練習。'}
function randomize(){const roles=['MT','ST','H1','H2','D1','D2','D3','D4'];roleEl.value=roles[Math.floor(Math.random()*8)];debuffEl.value=Math.random()<.5?'near':'far';let q=Math.random();hwEl.value=q<.45?'none':q<.725?'near':'far';info.textContent=`ランダム：${roleEl.value} / ${debuffEl.value==='near'?'ニア':'ファー'} / HW ${hwEl.value}`}
function hint(){info.textContent=hwEl.value==='near'?'ヒント：ハロワニアの持ち場を優先。ニア／ファーの距離を保つ。':hwEl.value==='far'?'ヒント：ハロワファーは外側の距離を確保。':'ヒント：ハロワなし。元のニア／ファー位置関係を崩さない。'}
function move(e){if(!running||paused)return;let r=arena.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;x=Math.max(.03,Math.min(.97,nx));y=Math.max(.03,Math.min(.97,ny));p.style.left=x*100+'%';p.style.top=y*100+'%'}
arena.addEventListener('pointerdown',move);arena.addEventListener('pointermove',e=>{if(e.buttons)move(e)});render(0)
</script>
</body></html>
